plugins {
    id 'ear'
}

version '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    deploy project(path: ':extra-config-ear-osgi', configuration: 'jarElements')
    deploy project(path: ':extra-config-ear-war', configuration: 'warElements')
    earlib (group: 'log4j', name: 'log4j', version: '1.2.15', ext: 'jar')
}

// Expose the EAR for consumption by the CICS bundle project
configurations {
    earElements {
        canBeResolved = false
        canBeConsumed = true
        outgoing.artifact(tasks.named('ear'))
    }
}
